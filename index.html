<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>IBRAHIM FARUQUEE / SOFTWARE ENGINEER</title>
    <meta name="description"
        content="Ibrahim Faruquee — Software engineer specializing in full-stack web development, applied machine learning, and real-time systems.">
    <!-- Ditherpunk favicon — static fallback, replaced at runtime by js/favicon.js -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="apple-touch-icon" href="assets/favicon.svg">
    <link rel="preload" href="fonts/Datatype.wdth.wght.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <style>
        /* Critical CSS — inlined for faster first paint */
        @font-face {
            font-family: 'Datatype';
            src: url('fonts/Datatype.wdth.wght.woff2') format('woff2');
            font-weight: 100 900;
            font-stretch: 75% 125%;
            font-display: swap
        }

        :root {
            --bg: #0a0a0a;
            --bg-elevated: #121210;
            --bg-cell: #0e0e0c;
            --fg: #c8c2b8;
            --fg-dim: #6b6560;
            --fg-bright: #f2eee7;
            --accent: #8a7f72;
            --accent-bright: #b5a898;
            --border: #24221f;
            --border-bright: #3a3632;
            --highlight: #e8c98c;
            --ink: #f2eee7;
            --grid-line: rgba(200, 194, 184, 0.04);
            --font-mono: 'Space Mono', 'Courier New', monospace;
            --font-display: 'Datatype', 'Space Mono', monospace;
            --pad: clamp(16px, 3vw, 40px);
            --transition-raw: 0.1s steps(2)
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html {
            scroll-behavior: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--fg-dim) var(--bg)
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.5;
            overflow-x: hidden;
            cursor: none;
            position: relative;
            -webkit-font-smoothing: antialiased
        }

        #bayer-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.04;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px
        }

        .cursor-dot {
            position: fixed;
            width: 6px;
            height: 6px;
            background: var(--fg-bright);
            border-radius: 0;
            pointer-events: none;
            z-index: 10001;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
            opacity: 0
        }

        .cursor-ring {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 1px solid var(--fg-dim);
            border-radius: 0;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            will-change: transform, width, height;
            opacity: 0
        }

        @media (hover: none), (pointer: coarse) {
            body { cursor: auto }
            .cursor-dot, .cursor-ring { display: none }
        }

        /* ---- NAV (critical) ---- */
        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 var(--pad);
            height: 56px;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(14px) saturate(1.2);
            -webkit-backdrop-filter: blur(14px) saturate(1.2);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase
        }

        .nav-brand {
            display: flex;
            gap: 8px;
            align-items: baseline;
            color: var(--fg-bright);
            font-family: var(--font-display);
            font-weight: 700;
            font-stretch: 100%;
            letter-spacing: 0.02em;
            text-decoration: none
        }

        .nav-brand span {
            color: var(--highlight);
            font-weight: 400
        }

        .nav-links {
            display: flex;
            gap: 28px
        }

        .nav-link {
            color: var(--fg-dim);
            transition: color var(--transition-raw);
            position: relative;
            text-decoration: none
        }

        .nav-status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--fg-dim);
            font-variant-numeric: tabular-nums
        }

        .nav-dot {
            width: 6px;
            height: 6px;
            background: var(--highlight);
            display: inline-block;
            animation: nav-pulse 2s steps(4) infinite
        }

        @keyframes nav-pulse {
            0%, 100% { opacity: 1 }
            50% { opacity: 0.3 }
        }

        /* ---- HERO (critical) ---- */
        .hero-section {
            position: relative;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-top: 56px;
            overflow: hidden
        }

        .hero-canvas {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 var(--pad)
        }

        .hero-eyebrow {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            letter-spacing: 0.2em;
            color: var(--fg-dim);
            text-transform: uppercase;
            margin-bottom: clamp(8px, 2vh, 24px)
        }

        .hero-eyebrow .hero-status {
            color: var(--highlight)
        }

        .hero-name {
            font-family: var(--font-display);
            font-weight: 800;
            font-stretch: 125%;
            font-size: clamp(64px, 17vw, 280px);
            line-height: 0.82;
            letter-spacing: -0.045em;
            color: var(--fg-bright);
            text-transform: uppercase
        }

        .hero-name .line {
            display: block;
            overflow: hidden
        }

        .hero-name .line--stroke {
            color: transparent;
            -webkit-text-stroke: 1.5px var(--fg-dim)
        }

        .hero-role {
            font-family: var(--font-display);
            font-stretch: 75%;
            font-size: clamp(14px, 2.2vw, 30px);
            letter-spacing: 0.3em;
            color: var(--accent-bright);
            text-transform: uppercase;
            margin-top: clamp(8px, 1.6vh, 18px)
        }

        /* gapless stat bar pinned to bottom of hero */
        .hero-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-top: 1px solid var(--border)
        }

        .hero-stat {
            padding: clamp(14px, 2.4vw, 28px) clamp(10px, 1.6vw, 22px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(10, 10, 10, 0.4)
        }

        .hero-stat:last-child { border-right: 0 }

        .hero-stat-num {
            font-family: var(--font-display);
            font-stretch: 100%;
            font-weight: 700;
            font-size: clamp(28px, 5vw, 64px);
            line-height: 1;
            color: var(--fg-bright);
            font-variant-numeric: tabular-nums
        }

        .hero-stat-label {
            font-size: 9px;
            letter-spacing: 0.18em;
            color: var(--fg-dim);
            text-transform: uppercase
        }

        /* Mobile hamburger — critical for first paint */
        .nav-hamburger {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            width: 44px;
            height: 44px;
            background: none;
            border: 1px solid var(--border);
            cursor: pointer;
            padding: 0;
            z-index: 1001
        }

        .hamburger-line {
            display: block;
            width: 18px;
            height: 1px;
            background: var(--fg-dim)
        }

        .startup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg);
            z-index: 9998;
            pointer-events: none;
            will-change: transform, opacity
        }

        @media (max-width: 600px) {
            .nav-hamburger { display: flex }
            .nav-links, .nav-status { display: none }
            .hero-stats { grid-template-columns: repeat(2, 1fr) }
            .hero-stat:nth-child(2) { border-right: 0 }
            .hero-stat:nth-child(-n+2) { border-bottom: 1px solid var(--border) }
        }
    </style>
    <link rel="stylesheet" href="css/style.css">
    <!-- Umami analytics -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="5cc65dfa-2570-4543-b045-535f415f3fdd"></script>
</head>

<body>
    <!-- NOISE OVERLAY -->
    <div class="noise-overlay"></div>

    <!-- CURSOR -->
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <!-- NAV — dynamically populated from YAML -->
    <nav class="nav-bar">
        <a href="#hero" class="nav-brand" data-cursor="link">IBRAHIM<span>F</span></a>
        <div class="nav-links" id="navLinks"></div>
        <div class="nav-status">
            <span class="nav-dot"></span>
            <span id="navClock">NYC —</span>
        </div>
        <button class="nav-hamburger" aria-label="Toggle navigation menu" aria-expanded="false">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>
    </nav>

    <!-- MOBILE MENU OVERLAY — dynamically populated from YAML -->
    <div class="mobile-menu" aria-hidden="true">
        <div class="mobile-menu-inner" id="mobileMenuLinks"></div>
        <div class="mobile-menu-footer">
            <span>SYS::ACTIVE</span>
            <span>v2.0.0</span>
        </div>
    </div>

    <!-- ==================== HERO SECTION ==================== -->
    <section id="hero" class="section hero-section">
        <div class="hero-canvas">
            <div class="hero-eyebrow">
                <span id="heroLocation">NEW YORK, NY</span>
                <span class="hero-status" id="heroStatus">OPEN TO WORK</span>
            </div>
            <div class="hero-name" id="heroName"><!-- populated from YAML --></div>
            <div class="hero-role" id="heroRole"><!-- populated from YAML --></div>
            <div class="hero-social-row" id="heroSocial"><!-- populated from YAML --></div>
        </div>
        <div class="hero-stats" id="heroStats"><!-- populated from YAML --></div>
    </section>

    <!-- ==================== MARQUEE 1 ==================== -->
    <div class="marquee" aria-hidden="true">
        <div class="marquee-track" id="marqueeTrack1"></div>
    </div>

    <!-- ==================== ABOUT SECTION ==================== -->
    <section id="about" class="section about-section">
        <div class="section-head" id="aboutHead"><!-- populated from YAML --></div>
        <div class="about-grid" id="aboutGrid"><!-- populated from YAML --></div>
    </section>

    <!-- ==================== MARQUEE 2 ==================== -->
    <div class="marquee marquee--rev" aria-hidden="true">
        <div class="marquee-track" id="marqueeTrack2"></div>
    </div>

    <!-- ==================== PROJECTS SECTION ==================== -->
    <section id="projects" class="section projects-section">
        <div class="section-head" id="projectsHead"><!-- populated from YAML --></div>
        <div class="projects-grid" id="projectsGrid"><!-- populated from YAML --></div>
    </section>

    <!-- ==================== EXPERIENCE SECTION ==================== -->
    <section id="experience" class="section experience-section">
        <div class="section-head" id="experienceHead"><!-- populated from YAML --></div>
        <div class="experience-list" id="experienceList"><!-- populated from YAML --></div>
    </section>

    <!-- ==================== CONTACT SECTION ==================== -->
    <section id="contact" class="section contact-section">
        <div class="section-head section-head--contact" id="contactHead"><!-- populated from YAML --></div>
        <div class="contact-grid" id="contactGrid"><!-- populated from YAML --></div>
        <div class="contact-footer" id="contactFooter"><!-- populated from YAML --></div>
    </section>

    <!-- SCRIPTS — deferred for parallel download and non-blocking execution -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollToPlugin.min.js" defer></script>
    <script src="js/bayer-background.js" defer></script>
    <script src="js/favicon.js" defer></script>
    <script src="js/main.js" defer></script>
    <!-- Attention-pulse sweep: periodic clickability signal on interactive icons -->
    <script src="js/attention-pulse.js" defer></script>
    <!-- Contact section point-cloud portrait (lazy-loads three.js itself) -->
    <script src="js/contact-cloud.js" defer></script>
</body>

</html>
