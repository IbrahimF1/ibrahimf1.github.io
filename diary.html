    <!-- Space Mono is self-hosted (fonts/) with @font-face in css/style.css —
         zero third-party font requests, fully service-worker cacheable. -->
    <style>
        /* Critical CSS — inlined for faster first paint (shared foundation, mirrors index.html) */
        @font-face {
            font-family: 'Datatype';
            src: url('fonts/Datatype.wdth.wght.woff2') format('woff2');
            font-weight: 100 900;
            font-stretch: 75% 125%;
            font-display: swap
        }

        :root {
            --bg: #0a0a0a;
            --bg-elevated: #111110;
            --fg: #c8c2b8;
            --fg-dim: #6b6560;
            --fg-bright: #e8e4df;
            --accent: #8a7f72;
            --accent-bright: #b5a898;
            --border: #2a2825;
            --border-bright: #3a3632;
            --highlight: #d4c5ab;
            --error: #8a6f5f;
            --grid-line: rgba(200, 194, 184, 0.04);
            --font-mono: 'Space Mono', 'Courier New', monospace;
            --font-display: 'Datatype', 'Space Mono', monospace;
            --transition-raw: 0.1s steps(2)
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html {
            scroll-behavior: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--fg-dim) var(--bg)
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative
        }

        html.js-cursor-ready body { cursor: none; }

        #bayer-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 256px 256px
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            display: flex;
            justify-content: space-between;
            padding: 0 12.5%
        }

        .grid-line {
            width: 1px;
            height: 100%;
            background: var(--grid-line)
        }

        .cursor-dot {
            position: fixed;
            width: 6px;
            height: 6px;
            background: var(--fg-bright);
            border-radius: 0;
            pointer-events: none;
            z-index: 10001;
            transform: translate(-50%, -50%);
            mix-blend-mode: difference;
            opacity: 0
        }

        .cursor-ring {
            position: fixed;
            width: 40px;
            height: 40px;
            border: 1px solid var(--fg-dim);
            border-radius: 0;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            will-change: transform, width, height;
            opacity: 0
        }

        @media (hover: none), (pointer: coarse) {
            body { cursor: auto }
            .cursor-dot, .cursor-ring { display: none }
        }

        .nav-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            z-index: 1000;
            background: rgba(10, 10, 10, 0.85);
            -webkit-backdrop-filter: blur(0px);
            backdrop-filter: blur(0px);
            border-bottom: 1px solid var(--border);
            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase
        }

        .nav-back {
            color: var(--accent-bright);
            text-decoration: none;
            transition: color var(--transition-raw);
            font-variant-numeric: tabular-nums
        }

        .nav-back:hover {
            color: var(--highlight)
        }

        .nav-brand {
            color: var(--fg-dim);
            letter-spacing: 0.2em
        }

        .nav-count {
            color: var(--accent-bright);
            font-variant-numeric: tabular-nums
        }

        .section {
            position: relative;
            min-height: 100vh;
            overflow: hidden
        }

        @media (prefers-reduced-motion: reduce) {
            .startup-overlay { display: none !important }
        }
    </style>

<body>
    <!-- Accessibility: skip straight to the diary log -->
    <a href="#diary" class="skip-link">Skip to content</a>

    <!-- NOISE OVERLAY -->
    <div class="noise-overlay"></div>

    <!-- GRID OVERLAY -->
    <div class="grid-overlay">
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
    </div>

    <!-- CURSOR -->
    <div class="cursor-dot"></div>
    <div class="cursor-ring"></div>

    <!-- NAV — simplified terminal header for the diary page -->
    <nav class="nav-bar">
        <a href="index.html" class="nav-back">[← HOME]</a>
        <div class="nav-brand">DEV_DIARY://LOG</div>
        <div class="nav-count" id="navCount">[---]</div>
    </nav>

    <!-- ==================== DIARY SECTION ==================== -->
    <section id="diary" class="section diary-section">
        <div class="section-label">05_DIARY</div>
        <div class="diary-bg-text" id="diaryBgText">DIARY</div>

        <header class="diary-header" id="diaryHeader">
            <!-- Intro populated from diary/diary.yaml by JS -->
        </header>

        <div class="diary-stack" id="diaryStack">
            <!-- Entries populated from diary/diary.yaml by JS -->
        </div>

        <footer class="diary-footer">
            <a href="index.html" class="diary-back-link">← RETURN TO PORTFOLIO</a>
            <span class="diary-footer-meta">END_OF_LOG // v1.0.0</span>
        </footer>
    </section>

    <!-- ==================== TRANSMISSION CONSOLE ==================== -->
    <!-- Anti-design telemetry overlay — live readouts, fixed to the viewport.
         Decorative; aria-hidden so assistive tech ignores it. -->
    <div class="console" aria-hidden="true">
        <div class="console__cell">UTC <span id="conClock">--:--:--</span></div>
        <div class="console__cell">CURSOR <span id="conX">0000</span>/<span id="conY">0000</span></div>
        <div class="console__cell">SIG <span class="sigbars" id="conSig"></span></div>
        <div class="console__cell">REC <span id="conPos">00/00</span></div>
    </div>

    <!-- Progress rail — one tick per transmission -->
    <aside class="rail" id="diaryRail" aria-label="Transmission navigation"></aside>

    <!-- ==================== READER OVERLAY ==================== -->
    <!-- Fullscreen reader for an expanded transmission body. Hidden by default. -->
    <div class="reader" id="diaryReader" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="diaryReaderTitle">
        <div class="reader__bar">
            <div class="reader__meta">
                <span class="reader__idx" id="diaryReaderIdx">00</span>
                <span class="reader__title" id="diaryReaderTitle">—</span>
                <span class="reader__date" id="diaryReaderDate">—</span>
            </div>
            <div class="reader__nav">
                <button class="reader__nav-btn reader__nav-btn--prev" id="diaryReaderPrev" type="button" aria-label="Previous transmission" disabled>‹ PREV</button>
                <button class="reader__nav-btn reader__nav-btn--next" id="diaryReaderNext" type="button" aria-label="Next transmission">NEXT ›</button>
            </div>
            <button class="reader__close" id="diaryReaderClose" type="button" aria-label="Close transmission">[ ESC ] CLOSE</button>
        </div>
        <div class="reader__scroll">
            <div class="reader__inner" id="diaryReaderInner"></div>
        </div>
    </div>

    <noscript>
        <div style="position:relative;z-index:2;max-width:680px;margin:0 auto;padding:120px var(--pad,28px) 80px;font-family:'Courier New',monospace;color:#c8c2b8;">
            <h1 style="font-size:clamp(30px,7vw,56px);color:#f2eee7;letter-spacing:-0.02em;margin-bottom:16px;">Dev Diary</h1>
            <p style="font-size:15px;line-height:1.8;margin-bottom:24px;">Ibrahim Faruquee&rsquo;s development journal. The interactive transmission console needs JavaScript to render its entries &mdash; enable it to read the field notes, or head back to the portfolio.</p>
            <p><a style="color:#d4c5ab;font-size:13px;letter-spacing:0.2em;text-transform:uppercase;" href="index.html">&larr; Return to portfolio</a></p>
            <p style="margin-top:32px;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#6b6560;">Enable JavaScript for the full experience &mdash; or subscribe via the <a style="color:#d4c5ab;" href="rss.xml">RSS feed</a>.</p>
        </div>
    </noscript>
